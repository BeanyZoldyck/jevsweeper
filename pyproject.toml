[project]
name = "jevsweeper"
version = "0.1.0"
description = "Play Windows XP Minesweeper with local-jev or hosted TypeSafe Jev."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typesafe-sdk",
    "pillow",
    "pywin32",
    "python-dotenv",
]

[project.scripts]
jevsweeper = "jevsweeper.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
